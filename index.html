<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Salas 64 Rankings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      color: #0f172a;
      background: #020617;
    }
    body{
      margin:0;
      padding:0;
      background: radial-gradient(circle at top, #0b1120 0, #020617 50%, #000 100%);
      color:#e5e7eb;
    }
    .page{
      max-width:1100px;
      margin:0 auto;
      padding:24px 16px 40px;
    }
    header{
      display:flex;
      flex-wrap:wrap;
      align-items:baseline;
      justify-content:space-between;
      gap:8px;
      margin-bottom:24px;
      border-bottom:1px solid #1f2933;
      padding-bottom:12px;
    }
    header h1{
      margin:0;
      font-size:1.6rem;
      font-weight:700;
      letter-spacing:0.03em;
    }
    header .meta{
      font-size:0.9rem;
      color:#9ca3af;
    }

    /* Single-column layout (games section removed) */
    .layout{
      display:grid;
      grid-template-columns:minmax(0, 1fr);
      gap:20px;
    }

    .card{
      background: rgba(15, 23, 42, 0.9);
      border-radius:16px;
      padding:16px 18px 18px;
      box-shadow:0 18px 45px rgba(0,0,0,0.6);
      border:1px solid rgba(55,65,81,0.8);
      backdrop-filter: blur(10px);
    }
    .card-header-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:4px;
    }
    .card h2{
      margin:0;
      font-size:1.2rem;
    }
    .card p.subtitle{
      margin:0 0 12px;
      font-size:0.85rem;
      color:#9ca3af;
    }
    .card-links{
      display:flex;
      gap:6px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
      font-size:0.8rem;
    }
    .info-link{
      color:#60a5fa;
      text-decoration:none;
      white-space:nowrap;
    }
    .info-link:hover{ text-decoration:underline; }
    .link-divider{ color:#4b5563; }

    .search-bar{
      margin-bottom:10px;
      display:flex;
      gap:8px;
      position:relative;
      z-index:5;
    }
    .search-wrapper{
      position:relative;
      flex:1;
    }
    .search-bar input{
      width:100%;
      border-radius:999px;
      border:1px solid #4b5563;
      padding:6px 10px;
      background:#020617;
      color:#e5e7eb;
      font-size:0.85rem;
      outline:none;
    }
    .search-bar input::placeholder{ color:#6b7280; }

    .search-results{
      position:absolute;
      top:110%;
      left:0;
      right:0;
      background:#020617;
      border-radius:12px;
      border:1px solid #4b5563;
      max-height:220px;
      overflow-y:auto;
      padding:4px 0;
      box-shadow:0 14px 35px rgba(0,0,0,0.7);
      display:none;
    }
    .search-result-item{
      padding:6px 10px;
      font-size:0.85rem;
      display:flex;
      justify-content:space-between;
      gap:8px;
      cursor:pointer;
    }
    .search-result-item span.team{ font-weight:500; }
    .search-result-item span.rank{
      color:#9ca3af;
      font-variant-numeric:tabular-nums;
    }
    .search-result-item:hover{ background:#111827; }

    .sort-row{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:6px;
      margin-bottom:6px;
      font-size:0.8rem;
      color:#9ca3af;
    }
    .sort-select{
      border-radius:999px;
      border:1px solid #4b5563;
      padding:4px 10px;
      background:#020617;
      color:#e5e7eb;
      font-size:0.8rem;
      outline:none;
    }

    .rankings-header{
      display:grid;
      grid-template-columns:50px 1fr 90px;
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:0.08em;
      color:#9ca3af;
      padding:6px 8px;
      border-radius:8px;
      background: rgba(15, 23, 42, 0.9);
      margin-bottom:4px;
    }
    .ranking-row{
      display:grid;
      grid-template-columns:50px 1fr 90px;
      padding:6px 8px;
      border-radius:999px;
      font-size:0.92rem;
      align-items:center;
      transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }
    .ranking-row:nth-child(odd){ background: rgba(15, 23, 42, 0.75); }
    .ranking-row:nth-child(even){ background: rgba(17, 24, 39, 0.85); }
    .ranking-row:hover{
      background: rgba(31, 41, 55, 0.98);
      transform: translateY(-1px);
    }
    .ranking-row.highlight{ box-shadow:0 0 0 2px #facc15; }

    .rank-num{ font-weight:600; color:#e5e7eb; }
    .team-name{
      font-weight:500;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .record{
      font-variant-numeric:tabular-nums;
      text-align:right;
      color:#e5e7eb;
    }

    footer{
      margin-top:22px;
      font-size:0.75rem;
      color:#6b7280;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1><strong>Salas 64</strong> — College Basketball Rankings</h1>
      <div class="meta" id="asOfText"></div>
    </header>

    <div class="layout">
      <section class="card" aria-label="Salas 64 Rankings">
        <div class="card-header-row">
          <h2>Salas 64 Rankings</h2>
          <div class="card-links">
            <a href="how-it-works.html" class="info-link">How do the rankings work?</a>
            <span class="link-divider">•</span>
            <a href="about.html" class="info-link">About Salas 64</a>
          </div>
        </div>
        <p class="subtitle">Adjusted top 64 using your weighting framework (records refreshed from your current table).</p>

        <div class="search-bar">
          <div class="search-wrapper">
            <input id="teamSearchInput" type="text" placeholder="Search team (e.g. Kansas, Colorado State)" />
            <div id="searchResults" class="search-results"></div>
          </div>
        </div>

        <div class="sort-row">
          <span>Sort by:</span>
          <select id="sortSelect" class="sort-select">
            <option value="rank">Rank</option>
            <option value="team">Team (A–Z)</option>
            <option value="record">Record</option>
          </select>
        </div>

        <div class="rankings-header">
          <span>#</span>
          <span>Team</span>
          <span style="text-align:right">Record</span>
        </div>
        <div id="rankingsList"></div>
      </section>
    </div>

    <footer>
      Salas 64 &copy; <span id="year"></span>. Updated daily.
    </footer>
  </div>

  <script>
    /*
      NOTE:
      Your full algorithm needs game-by-game inputs (margin, site, opponent Salas rank at tip, recency).
      The table you provided includes current W–L and efficiency context, but not per-game logs.
      So this page updates Salas 64 to match the TOP 64 TEAMS + CURRENT RECORDS from your “current rankings” table (rows 1–64).
      When you paste game logs later, we can compute your full Résumé/Form/SOS/March/Mid-major scoring exactly.
    */

    // Top 64 from your current table (rows 1–64) + current records
    const salasRankings = [
      { "rank": 1,  "team": "Michigan",         "record": "14-1" },
      { "rank": 2,  "team": "Arizona",          "record": "16-0" },
      { "rank": 3,  "team": "Iowa State",       "record": "16-0" },
      { "rank": 4,  "team": "Purdue",           "record": "15-1" },
      { "rank": 5,  "team": "Vanderbilt",       "record": "16-0" },
      { "rank": 6,  "team": "Gonzaga",          "record": "17-1" },
      { "rank": 7,  "team": "Illinois",         "record": "13-3" },
      { "rank": 8,  "team": "Duke",             "record": "15-1" },
      { "rank": 9,  "team": "Connecticut",      "record": "16-1" },
      { "rank": 10, "team": "Houston",          "record": "15-1" },

      { "rank": 11, "team": "BYU",              "record": "15-1" },
      { "rank": 12, "team": "Florida",          "record": "11-5" },
      { "rank": 13, "team": "Michigan State",   "record": "14-2" },
      { "rank": 14, "team": "Alabama",          "record": "11-5" },
      { "rank": 15, "team": "Virginia",         "record": "14-2" },
      { "rank": 16, "team": "Louisville",       "record": "12-4" },
      { "rank": 17, "team": "Nebraska",         "record": "16-0" },
      { "rank": 18, "team": "St. John's",       "record": "11-5" },
      { "rank": 19, "team": "Tennessee",        "record": "11-5" },
      { "rank": 20, "team": "Utah State",       "record": "14-1" },

      { "rank": 21, "team": "Iowa",             "record": "12-4" },
      { "rank": 22, "team": "Texas Tech",       "record": "12-4" },
      { "rank": 23, "team": "Kansas",           "record": "11-5" },
      { "rank": 24, "team": "NC State",         "record": "12-5" },
      { "rank": 25, "team": "Villanova",        "record": "13-3" },
      { "rank": 26, "team": "Kentucky",         "record": "10-6" },
      { "rank": 27, "team": "Indiana",          "record": "12-4" },
      { "rank": 28, "team": "Georgia",          "record": "14-2" },
      { "rank": 29, "team": "Clemson",          "record": "14-3" },
      { "rank": 30, "team": "Arkansas",         "record": "12-4" },

      { "rank": 31, "team": "Auburn",           "record": "10-6" },
      { "rank": 32, "team": "SMU",              "record": "12-4" },
      { "rank": 33, "team": "North Carolina",   "record": "14-2" },
      { "rank": 34, "team": "Saint Louis",      "record": "15-1" },
      { "rank": 35, "team": "Saint Mary's",     "record": "16-2" },
      { "rank": 36, "team": "Miami FL",         "record": "14-2" },
      { "rank": 37, "team": "Ohio State",       "record": "11-5" },
      { "rank": 38, "team": "Wisconsin",        "record": "11-5" },
      { "rank": 39, "team": "UCLA",             "record": "11-5" },
      { "rank": 40, "team": "LSU",              "record": "12-4" },

      { "rank": 41, "team": "Texas A&M",        "record": "13-3" },
      { "rank": 42, "team": "Baylor",           "record": "10-5" },
      { "rank": 43, "team": "Seton Hall",       "record": "14-2" },
      { "rank": 44, "team": "Creighton",        "record": "10-7" },
      { "rank": 45, "team": "UCF",              "record": "13-2" },
      { "rank": 46, "team": "VCU",              "record": "11-6" },
      { "rank": 47, "team": "Texas",            "record": "10-6" },
      { "rank": 48, "team": "Washington",       "record": "10-6" },
      { "rank": 49, "team": "USC",              "record": "13-3" },
      { "rank": 50, "team": "Santa Clara",      "record": "14-5" },

      { "rank": 51, "team": "New Mexico",       "record": "13-3" },
      { "rank": 52, "team": "San Diego State",  "record": "11-4" },
      { "rank": 53, "team": "TCU",              "record": "11-5" },
      { "rank": 54, "team": "Oklahoma",         "record": "11-5" },
      { "rank": 55, "team": "Oklahoma State",   "record": "13-3" },
      { "rank": 56, "team": "Akron",            "record": "12-4" },
      { "rank": 57, "team": "Missouri",         "record": "12-4" },
      { "rank": 58, "team": "Butler",           "record": "10-6" },
      { "rank": 59, "team": "West Virginia",    "record": "11-5" },
      { "rank": 60, "team": "Syracuse",         "record": "11-5" },

      { "rank": 61, "team": "Northwestern",     "record": "8-8" },
      { "rank": 62, "team": "Wake Forest",      "record": "10-7" },
      { "rank": 63, "team": "George Washington","record": "12-5" },
      { "rank": 64, "team": "Cincinnati",       "record": "8-8" }
    ];

    const rankingsAsOf = "As of Thu, Dec 18";

    let currentSortKey = "rank";
    let currentSortDir = "asc";

    function parseRecord(rec){
      const cleaned = rec.replace(/–/g, "-");
      const parts = cleaned.split("-");
      const wins = parseInt(parts[0], 10) || 0;
      const losses = parseInt(parts[1], 10) || 0;
      return { wins, losses };
    }

    function renderRankings(){
      const container = document.getElementById("rankingsList");
      container.innerHTML = "";

      const data = [...salasRankings].sort((a,b)=>{
        if(currentSortKey === "rank"){
          return currentSortDir === "asc" ? a.rank - b.rank : b.rank - a.rank;
        }
        if(currentSortKey === "team"){
          const an = a.team.toLowerCase();
          const bn = b.team.toLowerCase();
          if(an < bn) return currentSortDir === "asc" ? -1 : 1;
          if(an > bn) return currentSortDir === "asc" ? 1 : -1;
          return 0;
        }
        if(currentSortKey === "record"){
          const ar = parseRecord(a.record);
          const br = parseRecord(b.record);
          const pa = (ar.wins + ar.losses) > 0 ? ar.wins / (ar.wins + ar.losses) : 0;
          const pb = (br.wins + br.losses) > 0 ? br.wins / (br.wins + br.losses) : 0;
          if(pa !== pb) return pb - pa;
          if(ar.wins !== br.wins) return br.wins - ar.wins;
          return ar.losses - br.losses;
        }
        return 0;
      });

      data.forEach((item)=>{
        const row = document.createElement("div");
        row.className = "ranking-row";
        row.dataset.team = item.team.toLowerCase();

        const rankCell = document.createElement("div");
        rankCell.className = "rank-num";
        rankCell.textContent = item.rank;

        const teamCell = document.createElement("div");
        teamCell.className = "team-name";
        teamCell.textContent = item.team;

        const recordCell = document.createElement("div");
        recordCell.className = "record";
        recordCell.textContent = item.record;

        row.appendChild(rankCell);
        row.appendChild(teamCell);
        row.appendChild(recordCell);
        container.appendChild(row);
      });
    }

    const allTeams = salasRankings.map((t)=>({ name:t.team, rank:t.rank }));

    function scrollToTeam(teamName){
      const rows = Array.from(document.querySelectorAll(".ranking-row"));
      rows.forEach((r)=>r.classList.remove("highlight"));
      const target = rows.find((r)=>(r.dataset.team || "").toLowerCase() === teamName.toLowerCase());
      if(target){
        target.classList.add("highlight");
        target.scrollIntoView({ behavior:"smooth", block:"center" });
      }
    }

    function updateSearchResults(){
      const input = document.getElementById("teamSearchInput");
      const resultsBox = document.getElementById("searchResults");
      if(!input || !resultsBox) return;

      const query = input.value.trim().toLowerCase();
      resultsBox.innerHTML = "";

      if(!query){
        resultsBox.style.display = "none";
        return;
      }

      const matches = allTeams.filter((t)=>t.name.toLowerCase().startsWith(query));
      if(!matches.length){
        resultsBox.style.display = "none";
        return;
      }

      matches.slice(0,10).forEach((t)=>{
        const item = document.createElement("div");
        item.className = "search-result-item";

        const spanTeam = document.createElement("span");
        spanTeam.className = "team";
        spanTeam.textContent = t.name;

        const spanRank = document.createElement("span");
        spanRank.className = "rank";
        spanRank.textContent = `#${t.rank}`;

        item.appendChild(spanTeam);
        item.appendChild(spanRank);

        item.addEventListener("click", ()=>{
          input.value = t.name;
          resultsBox.style.display = "none";
          scrollToTeam(t.name);
        });

        resultsBox.appendChild(item);
      });

      resultsBox.style.display = "block";
    }

    function initPage(){
      document.getElementById("asOfText").textContent = rankingsAsOf;
      document.getElementById("year").textContent = new Date().getFullYear();

      renderRankings();

      const sortSelect = document.getElementById("sortSelect");
      if(sortSelect){
        sortSelect.addEventListener("change", ()=>{
          currentSortKey = sortSelect.value;
          currentSortDir = "asc";
          renderRankings();
        });
      }

      const searchInput = document.getElementById("teamSearchInput");
      if(searchInput){
        searchInput.addEventListener("input", updateSearchResults);
        searchInput.addEventListener("keydown", (e)=>{
          if(e.key === "Enter"){
            const resultsBox = document.getElementById("searchResults");
            const firstItem = resultsBox ? resultsBox.querySelector(".search-result-item span.team") : null;
            if(firstItem){
              scrollToTeam(firstItem.textContent || "");
              resultsBox.style.display = "none";
            }
          }
        });
      }

      document.addEventListener("click", (e)=>{
        const wrapper = document.querySelector(".search-wrapper");
        const resultsBox = document.getElementById("searchResults");
        if(!wrapper || !resultsBox) return;
        if(!wrapper.contains(e.target)){
          resultsBox.style.display = "none";
        }
      });
    }

    initPage();
  </script>
</body>
</html>
