  // Salas 64 rankings (Mon, Dec 15)
  const salasRankings = [
    { "rank": 1,  "team": "Iowa State",     "record": "11–0" },
    { "rank": 2,  "team": "Arizona",        "record": "9–0" },

    { "rank": 21, "team": "Baylor",         "record": "7–2" },

    { "rank": 23, "team": "Texas Tech",     "record": "7–3" },
    { "rank": 24, "team": "Georgia",        "record": "9–1" },
    { "rank": 25, "team": "Ohio State",     "record": "9–2" },
    { "rank": 26, "team": "UCLA",           "record": "7–3" },

    { "rank": 31, "team": "Florida",        "record": "6–4" },

    { "rank": 35, "team": "Saint Mary’s",   "record": "9–2" },
    { "rank": 36, "team": "Virginia",       "record": "9–1" },
    { "rank": 37, "team": "LSU",            "record": "9–1" },
    { "rank": 38, "team": "SMU",            "record": "9–2" },
    { "rank": 39, "team": "Miami FL",       "record": "9–2" },
    { "rank": 40, "team": "Wisconsin",      "record": "7–3" },

    { "rank": 41, "team": "Ole Miss",       "record": "6–4" },
    { "rank": 42, "team": "Cincinnati",     "record": "6–4" },
    { "rank": 43, "team": "Washington",     "record": "8–3" },
    { "rank": 44, "team": "Kentucky",       "record": "7–4" },
    { "rank": 45, "team": "Northwestern",   "record": "6–4" },
    { "rank": 46, "team": "Creighton",      "record": "5–5" },
    { "rank": 47, "team": "San Diego State","record": "5–3" },
    { "rank": 48, "team": "Kansas State",   "record": "7–4" },
    { "rank": 49, "team": "Oregon",         "record": "5–5" },
    { "rank": 50, "team": "Utah",           "record": "7–4" },

    { "rank": 51, "team": "Dayton",         "record": "8–3" },
    { "rank": 52, "team": "Syracuse",       "record": "6–4" },
    { "rank": 53, "team": "George Mason",   "record": "10–1" },
    { "rank": 54, "team": "Maryland",       "record": "6–5" },
    { "rank": 55, "team": "Arkansas",       "record": "8–2" },
    { "rank": 56, "team": "Oklahoma",       "record": "7–3" },
    { "rank": 57, "team": "Liberty",        "record": "6–3" },
    { "rank": 58, "team": "Seton Hall",     "record": "10–1" },
    { "rank": 59, "team": "Colorado State", "record": "9–2" },
    { "rank": 60, "team": "Clemson",        "record": "8–3" },

    { "rank": 61, "team": "UC San Diego",   "record": "10–1" },
    { "rank": 62, "team": "Saint Louis",    "record": "10–1" },
    { "rank": 63, "team": "UCF",            "record": "8–1" },
    { "rank": 64, "team": "Georgetown",     "record": "7–3" }
  ];

  // No Salas 64 teams play on Mon, Dec 15 → no prediction cards
  const games = [];

  const rankingsAsOf = "As of Mon, Dec 15";
  const gamesDayLabel = "Games involving Salas 64 teams (Mon, Dec 15)";

  let currentSortKey = "rank";
  let currentSortDir = "asc";

  function parseRecord(rec) {
    const cleaned = rec.replace(/–/g, "-");
    const parts = cleaned.split("-");
    const wins = parseInt(parts[0], 10) || 0;
    const losses = parseInt(parts[1], 10) || 0;
    return { wins, losses };
  }

  function renderRankings() {
    const container = document.getElementById("rankingsList");
    container.innerHTML = "";

    const data = [].concat(salasRankings).sort((a, b) => {
      if (currentSortKey === "rank") {
        return currentSortDir === "asc" ? a.rank - b.rank : b.rank - a.rank;
      }
      if (currentSortKey === "team") {
        const an = a.team.toLowerCase();
        const bn = b.team.toLowerCase();
        if (an < bn) return currentSortDir === "asc" ? -1 : 1;
        if (an > bn) return currentSortDir === "asc" ? 1 : -1;
        return 0;
      }
      if (currentSortKey === "record") {
        const ar = parseRecord(a.record);
        const br = parseRecord(b.record);
        const pa = (ar.wins + ar.losses) > 0 ? ar.wins / (ar.wins + ar.losses) : 0;
        const pb = (br.wins + br.losses) > 0 ? br.wins / (br.wins + br.losses) : 0;

        if (pa !== pb) return pb - pa;
        if (ar.wins !== br.wins) return br.wins - ar.wins;
        return ar.losses - br.losses;
      }
      return 0;
    });

    data.forEach((item) => {
      const row = document.createElement("div");
      row.className = "ranking-row";
      row.dataset.team = item.team.toLowerCase();

      const rankCell = document.createElement("div");
      rankCell.className = "rank-num";
      rankCell.textContent = item.rank;

      const teamCell = document.createElement("div");
      teamCell.className = "team-name";
      teamCell.textContent = item.team;

      const recordCell = document.createElement("div");
      recordCell.className = "record";
      recordCell.textContent = item.record;

      row.appendChild(rankCell);
      row.appendChild(teamCell);
      row.appendChild(recordCell);

      container.appendChild(row);
    });
  }

  function makeGameCard(game) {
    const card = document.createElement("article");
    card.className = "game";

    const topline = document.createElement("div");
    topline.className = "game-topline";

    const matchup = document.createElement("div");
    matchup.className = "matchup";
    matchup.textContent = game.matchup;

    const meta = document.createElement("div");
    meta.className = "game-meta";
    meta.textContent = game.time;

    topline.appendChild(matchup);
    topline.appendChild(meta);

    const body = document.createElement("div");
    body.className = "game-body";
    body.textContent = "Prediction: " + game.prediction;

    card.appendChild(topline);
    card.appendChild(body);
    return card;
  }

  function renderGames() {
    const bothContainer = document.getElementById("gamesBothList");
    const oneContainer = document.getElementById("gamesOneList");
    bothContainer.innerHTML = "";
    oneContainer.innerHTML = "";

    const salasSet = new Set(salasRankings.map(function (t) { return t.team.toLowerCase(); }));

    const gamesWithTwo = [];
    const gamesWithOne = [];

    games.forEach(function (g) {
      const in1 = salasSet.has((g.team1 || "").toLowerCase());
      const in2 = salasSet.has((g.team2 || "").toLowerCase());
      if (in1 && in2) {
        gamesWithTwo.push(g);
      } else if (in1 || in2) {
        gamesWithOne.push(g);
      }
    });

    if (gamesWithTwo.length === 0) {
      const empty = document.createElement("div");
      empty.className = "game-body";
      empty.textContent = "No games today with two Salas 64 teams.";
      bothContainer.appendChild(empty);
    } else {
      gamesWithTwo.forEach(function (g) {
        bothContainer.appendChild(makeGameCard(g));
      });
    }

    if (gamesWithOne.length === 0) {
      const empty = document.createElement("div");
      empty.className = "game-body";
      empty.textContent = "No games today with one Salas 64 team.";
      oneContainer.appendChild(empty);
    } else {
      gamesWithOne.forEach(function (g) {
        oneContainer.appendChild(makeGameCard(g));
      });
    }
  }

  const allTeams = salasRankings.map(function (t) { return { name: t.team, rank: t.rank }; });

  function scrollToTeam(teamName) {
    const rows = Array.prototype.slice.call(document.querySelectorAll(".ranking-row"));
    rows.forEach(function (r) { r.classList.remove("highlight"); });
    const target = rows.find(function (r) {
      return (r.dataset.team || "").toLowerCase() === teamName.toLowerCase();
    });
    if (target) {
      target.classList.add("highlight");
      target.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function updateSearchResults() {
    const input = document.getElementById("teamSearchInput");
    const resultsBox = document.getElementById("searchResults");
    if (!input || !resultsBox) return;

    const query = input.value.trim().toLowerCase();
    resultsBox.innerHTML = "";

    if (!query) {
      resultsBox.style.display = "none";
      return;
    }

    const matches = allTeams.filter(function (t) {
      return t.name.toLowerCase().startsWith(query);
    });

    if (!matches.length) {
      resultsBox.style.display = "none";
      return;
    }

    matches.slice(0, 10).forEach(function (t) {
      const item = document.createElement("div");
      item.className = "search-result-item";

      const spanTeam = document.createElement("span");
      spanTeam.className = "team";
      spanTeam.textContent = t.name;

      const spanRank = document.createElement("span");
      spanRank.className = "rank";
      spanRank.textContent = "#" + t.rank;

      item.appendChild(spanTeam);
      item.appendChild(spanRank);

      item.addEventListener("click", function () {
        input.value = t.name;
        resultsBox.style.display = "none";
        scrollToTeam(t.name);
      });

      resultsBox.appendChild(item);
    });

    resultsBox.style.display = "block";
  }

  function initPage() {
    document.getElementById("asOfText").textContent = rankingsAsOf;
    document.getElementById("gamesSubtitle").textContent = gamesDayLabel;
    document.getElementById("year").textContent = new Date().getFullYear();

    renderRankings();
    renderGames();

    const sortSelect = document.getElementById("sortSelect");
    if (sortSelect) {
      sortSelect.addEventListener("change", function () {
        currentSortKey = sortSelect.value;
        currentSortDir = "asc";
        renderRankings();
      });
    }

    const searchInput = document.getElementById("teamSearchInput");
    if (searchInput) {
      searchInput.addEventListener("input", updateSearchResults);
      searchInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          const resultsBox = document.getElementById("searchResults");
          const firstItem = resultsBox
            ? resultsBox.querySelector(".search-result-item span.team")
            : null;
          if (firstItem) {
            scrollToTeam(firstItem.textContent || "");
            resultsBox.style.display = "none";
          }
        }
      });
    }

    document.addEventListener("click", function (e) {
      const wrapper = document.querySelector(".search-wrapper");
      const resultsBox = document.getElementById("searchResults");
      if (!wrapper || !resultsBox) return;
      if (!wrapper.contains(e.target)) {
        resultsBox.style.display = "none";
      }
    });
  }

  initPage();
</script>
