<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Salas 64 Rankings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      color: #0f172a;
      background: #020617;
    }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #0b1120 0, #020617 50%, #000 100%);
      color: #e5e7eb;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid #1f2933;
      padding-bottom: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .header-right {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    header .meta {
      font-size: 0.9rem;
      color: #9ca3af;
    }
    .header-link {
      font-size: 0.85rem;
      color: #60a5fa;
      text-decoration: none;
      white-space: nowrap;
    }
    .header-link:hover {
      text-decoration: underline;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr);
      gap: 20px;
    }
    @media (max-width: 800px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      padding: 16px 18px 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(55, 65, 81, 0.8);
      backdrop-filter: blur(10px);
    }
    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .card h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .card p.subtitle {
      margin: 0 0 12px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .info-link {
      font-size: 0.8rem;
      color: #60a5fa;
      text-decoration: none;
      white-space: nowrap;
    }
    .info-link:hover {
      text-decoration: underline;
    }

    /* Controls row (search + sort) */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    /* Search bar styles */
    .search-bar {
      flex: 1;
      position: relative;
    }
    .search-bar input {
      width: 100%;
      border-radius: 999px;
      border: 1px solid #4b5563;
      padding: 6px 10px;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.85rem;
      outline: none;
    }
    .search-bar input::placeholder {
      color: #6b7280;
    }

    /* Dropdown suggestions */
    .search-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: rgba(15, 23, 42, 0.98);
      border-radius: 12px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
      z-index: 20;
      display: none;
    }
    .suggestion-item {
      padding: 6px 10px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }
    .suggestion-item span.team {
      font-weight: 500;
    }
    .suggestion-item span.rank {
      color: #9ca3af;
      font-variant-numeric: tabular-nums;
    }
    .suggestion-item:hover {
      background: rgba(31, 41, 55, 0.98);
    }

    /* Sort control */
    .sort-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .sort-control select {
      border-radius: 999px;
      border: 1px solid #4b5563;
      padding: 4px 8px;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
      outline: none;
    }

    /* 3-column layout: #, Team, Record */
    .rankings-header {
      display: grid;
      grid-template-columns: 50px 1fr 90px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.9);
      margin-bottom: 4px;
    }
    .ranking-row {
      display: grid;
      grid-template-columns: 50px 1fr 90px;
      padding: 6px 8px;
      border-radius: 999px;
      font-size: 0.92rem;
      align-items: center;
      transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }
    .ranking-row:nth-child(odd) {
      background: rgba(15, 23, 42, 0.75);
    }
    .ranking-row:nth-child(even) {
      background: rgba(17, 24, 39, 0.85);
    }
    .ranking-row:hover {
      background: rgba(31, 41, 55, 0.98);
      transform: translateY(-1px);
    }
    .ranking-row.highlight {
      box-shadow: 0 0 0 2px #facc15;
    }
    .rank-num {
      font-weight: 600;
      color: #e5e7eb;
    }
    .team-name {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .record {
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: #e5e7eb;
    }

    .games-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .game {
      border-radius: 12px;
      padding: 10px 11px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 64, 175, 0.7));
      border: 1px solid rgba(55, 65, 81, 0.9);
    }
    .game-topline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .matchup {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .game-meta {
      font-size: 0.8rem;
      color: #cbd5f5;
      text-align: right;
    }
    .game-body {
      font-size: 0.83rem;
      color: #e5e7eb;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      margin-bottom: 6px;
    }
    footer {
      margin-top: 22px;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1><strong>Salas 64</strong> — College Basketball Rankings</h1>
      <div class="header-right">
        <div class="meta" id="asOfText"></div>
        <a href="about-salas-64.html" class="header-link">About Salas 64</a>
      </div>
    </header>

    <div class="layout">
      <section class="card" aria-label="Salas 64 Rankings">
        <div class="card-header-row">
          <h2>Salas 64 Rankings</h2>
          <a href="how-it-works.html" class="info-link">How do the rankings work?</a>
        </div>
        <p class="subtitle">Custom rankings based on efficiency, injuries, and March potential.</p>

        <div class="controls-row">
          <!-- Search bar with dropdown suggestions -->
          <div class="search-bar">
            <input
              id="teamSearchInput"
              type="text"
              placeholder="Search team (e.g. Kansas, Alabama)"
              autocomplete="off"
            />
            <div id="searchSuggestions" class="search-suggestions"></div>
          </div>

          <!-- Sort control -->
          <div class="sort-control">
            <span>Sort by:</span>
            <select id="sortSelect">
              <option value="rank">Rank</option>
              <option value="team">Team (A–Z)</option>
              <option value="record">Record</option>
            </select>
          </div>
        </div>

        <div class="rankings-header">
          <span>#</span>
          <span>Team</span>
          <span style="text-align:right">Record</span>
        </div>
        <div id="rankingsList"></div>
      </section>

      <section class="card" aria-label="Games Involving Salas 64 Teams">
        <h2>Games Involving Salas 64 Teams</h2>
        <p class="subtitle" id="gamesSubtitle"></p>

        <div class="badge">Today's Slate</div>

        <div class="games-list" id="gamesList"></div>
      </section>
    </div>

    <footer>
      Salas 64 &copy; <span id="year"></span>. Updated daily.
    </footer>
  </div>

  <script>

      { "rank": 33, "team": "Northwestern",    "record": "4–0" },

      { "rank": 37, "team": "LSU",             "record": "3–0" },

      { "rank": 43, "team": "Mississippi State","record": "2–1" },

      { "rank": 52, "team": "SMU",             "record": "4–0" },
      { "rank": 53, "team": "Virginia",        "record": "4–0" },
      { "rank": 54, "team": "Syracuse",        "record": "3–0" },
      { "rank": 55, "team": "Marquette",       "record": "3–2" },
      { "rank": 56, "team": "Texas A&M",       "record": "2–2" },
      { "rank": 57, "team": "VCU",             "record": "2–1" },
      { "rank": 58, "team": "Memphis",         "record": "1–1" },
      { "rank": 59, "team": "Oklahoma",        "record": "2–2" },
      { "rank": 60, "team": "Oklahoma State",  "record": "3–0" },
      { "rank": 61, "team": "West Virginia",   "record": "4–0" },
      { "rank": 62, "team": "Dayton",          "record": "3–1" },
      { "rank": 63, "team": "Boise State",     "record": "3–1" },
      { "rank": 64, "team": "Colorado",        "record": "3–0" }
    ];

    // Games you gave for tomorrow
    const games = [
      {
        matchup: "Notre Dame at Ohio State",
        time: "Sat, Nov 15 • 9:30 AM PT",
        prediction: "Ohio State 78–70"
      },
      {
        matchup: "Texas A&M–Corpus Christi at Oklahoma State",
        time: "Sat, Nov 15 • 11:00 AM PT",
        prediction: "Oklahoma State 88–68"
      },
      {
        matchup: "Houston vs Auburn (neutral)",
        time: "Sat, Nov 15 • 12:00 PM PT",
        prediction: "Houston 74–68"
      },
      {
        matchup: "UNLV at Memphis",
        time: "Sat, Nov 15 • 2:00 PM PT",
        prediction: "Memphis 82–72"
      },
      {
        matchup: "Colorado State at Loyola Chicago",
        time: "Sat, Nov 15 • 2:00 PM PT",
        prediction: "Colorado State 75–71"
      },
      {
        matchup: "Incarnate Word at Indiana",
        time: "Sat, Nov 15 • 2:30 PM PT",
        prediction: "Indiana 90–62"
      },
      {
        matchup: "Mount St. Mary’s at Cincinnati",
        time: "Sat, Nov 15 • 3:00 PM PT",
        prediction: "Cincinnati 84–60"
      },
      {
        matchup: "Akron at Purdue",
        time: "Sat, Nov 15 • 4:30 PM PT",
        prediction: "Purdue 85–64"
      },
      {
        matchup: "Miami vs Florida (neutral)",
        time: "Sat, Nov 15 • 5:30 PM PT",
        prediction: "Florida 81–77"
      }
    ];

    const rankingsAsOf = "As of Fri, Nov 14, 2025";
    const gamesDayLabel = "All games involving Salas 64 teams (Sat, Nov 15, 2025)";

    let currentRankings = [...salasRankings];

    function renderRankings() {
      const container = document.getElementById("rankingsList");
      container.innerHTML = "";
      currentRankings.forEach((item) => {
        const row = document.createElement("div");
        row.className = "ranking-row";
        row.dataset.team = item.team.toLowerCase();

        const rankCell = document.createElement("div");
        rankCell.className = "rank-num";
        rankCell.textContent = item.rank;

        const teamCell = document.createElement("div");
        teamCell.className = "team-name";
        teamCell.textContent = item.team;

        const recordCell = document.createElement("div");
        recordCell.className = "record";
        recordCell.textContent = item.record;

        row.appendChild(rankCell);
        row.appendChild(teamCell);
        row.appendChild(recordCell);

        container.appendChild(row);
      });
    }

    function renderGames() {
      const container = document.getElementById("gamesList");
      container.innerHTML = "";
      games.forEach((game, index) => {
        const card = document.createElement("article");
        card.className = "game";

        const topline = document.createElement("div");
        topline.className = "game-topline";

        const matchup = document.createElement("div");
        matchup.className = "matchup";
        matchup.textContent = `#${index + 1} • ${game.matchup}`;

        const meta = document.createElement("div");
        meta.className = "game-meta";
        meta.textContent = game.time;

        topline.appendChild(matchup);
        topline.appendChild(meta);

        const body = document.createElement("div");
        body.className = "game-body";
        body.innerHTML = `<strong>Prediction:</strong> ${game.prediction}`;

        card.appendChild(topline);
        card.appendChild(body);
        container.appendChild(card);
      });
    }

    // Build dropdown suggestions from search input
    function updateSuggestions() {
      const input = document.getElementById("teamSearchInput");
      const box = document.getElementById("searchSuggestions");
      if (!input || !box) return;

      const query = input.value.trim().toLowerCase();
      box.innerHTML = "";

      if (!query) {
        box.style.display = "none";
        return;
      }

      const matches = salasRankings
        .filter(item => item.team.toLowerCase().includes(query))
        .slice(0, 10); // limit results

      if (matches.length === 0) {
        box.style.display = "none";
        return;
      }

      matches.forEach(item => {
        const div = document.createElement("div");
        div.className = "suggestion-item";
        div.dataset.team = item.team.toLowerCase();

        const teamSpan = document.createElement("span");
        teamSpan.className = "team";
        teamSpan.textContent = item.team;

        const rankSpan = document.createElement("span");
        rankSpan.className = "rank";
        rankSpan.textContent = `#${item.rank}`;

        div.appendChild(teamSpan);
        div.appendChild(rankSpan);

        div.addEventListener("click", () => {
          scrollToTeam(item.team);
          box.style.display = "none";
        });

        box.appendChild(div);
      });

      box.style.display = "block";
    }

    // Scroll to and highlight a given team
    function scrollToTeam(teamName) {
      const rows = Array.from(document.querySelectorAll(".ranking-row"));
      rows.forEach(r => r.classList.remove("highlight"));

      const target = rows.find(r => (r.dataset.team || "") === teamName.toLowerCase());
      if (target) {
        target.classList.add("highlight");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    // Sort control
    function applySort() {
      const select = document.getElementById("sortSelect");
      if (!select) return;
      const value = select.value;

      if (value === "rank") {
        currentRankings = [...salasRankings].sort((a, b) => a.rank - b.rank);
      } else if (value === "team") {
        currentRankings = [...salasRankings].sort((a, b) =>
          a.team.localeCompare(b.team)
        );
      } else if (value === "record") {
        // naive record sort: wins minus losses; if tie, fall back to rank
        function parseRecord(rec) {
          const cleaned = rec.replace(/\s/g, "").replace("–", "-");
          const [w, l] = cleaned.split("-").map(Number);
          if (isNaN(w) || isNaN(l)) return 0;
          return w - l;
        }
        currentRankings = [...salasRankings].sort((a, b) => {
          const diff = parseRecord(b.record) - parseRecord(a.record);
          if (diff !== 0) return diff;
          return a.rank - b.rank;
        });
      }

      renderRankings();
    }

    function initPage() {
      document.getElementById("asOfText").textContent = rankingsAsOf;
      document.getElementById("gamesSubtitle").textContent = gamesDayLabel;
      document.getElementById("year").textContent = new Date().getFullYear();

      applySort();     // default sort = rank
      renderGames();

      const searchInput = document.getElementById("teamSearchInput");
      const suggestionsBox = document.getElementById("searchSuggestions");
      const sortSelect = document.getElementById("sortSelect");

      if (searchInput) {
        searchInput.addEventListener("input", updateSuggestions);
        searchInput.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            suggestionsBox.style.display = "none";
          }
        });
      }

      // Click outside to close suggestions
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search-bar")) {
          if (suggestionsBox) suggestionsBox.style.display = "none";
        }
      });

      if (sortSelect) {
        sortSelect.addEventListener("change", applySort);
      }
    }

    initPage();
  </script>
</body>
</html>
