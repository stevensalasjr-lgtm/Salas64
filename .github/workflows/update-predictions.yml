name: Update You vs Salas

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: salas-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh schedule and results
        run: python scripts/update_predictions.py

      - name: Save challenge archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/predictions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update daily predictions and season results'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
