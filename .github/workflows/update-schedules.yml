name: Update Team Schedules

on:
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: salas-team-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch team schedules and completed scores
        run: python scripts/update_schedules.py
      - name: Save schedule data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedules.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update team schedules and results'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Request website refresh
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
